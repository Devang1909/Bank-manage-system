<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Profile</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f6f9;
        }

        .profile-container {
            width: 700px;
            margin: 50px auto;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }

        .profile-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .profile-icon {
            width: 90px;
            height: 90px;
            background: #2563eb;
            color: white;
            border-radius: 50%;
            margin: auto;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
        }

        .profile-header h2 {
            margin-top: 15px;
        }

        .section {
            margin-top: 25px;
        }

        .section h3 {
            margin-bottom: 15px;
            color: #2563eb;
        }

        .info {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .info-box {
            background: #f8fafc;
            padding: 15px;
            border-radius: 8px;
        }

        .info-box label {
            display: block;
            color: #777;
            font-size: 13px;
            margin-bottom: 5px;
        }

        .info-box span {
            font-weight: bold;
        }

        .buttons {
            margin-top: 30px;
            display: flex;
            gap: 10px;
        }

        button {
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            cursor: pointer;
            background: #2563eb;
            color: white;
        }

        button:hover {
            background: #1d4ed8;
        }

        /* ============================= */
/* Tablet Responsive - 768px     */
/* ============================= */

@media (max-width: 768px) {

    .profile-container {
        width: 90%;
        margin: 30px auto;
        padding: 25px;
    }

    .profile-icon {
        width: 80px;
        height: 80px;
        font-size: 35px;
    }

    .info {
        grid-template-columns: 1fr 1fr;
        gap: 12px;
    }

    .info-box {
        padding: 13px;
    }

    .buttons {
        flex-wrap: wrap;
    }

    button {
        padding: 11px 18px;
    }
}


/* ============================= */
/* Mobile Responsive - 600px     */
/* ============================= */

@media (max-width: 600px) {

    body {
        padding: 10px;
    }

    .profile-container {
        width: 100%;
        margin: 20px auto;
        padding: 20px;
        border-radius: 12px;
    }

    .profile-header {
        margin-bottom: 20px;
    }

    .profile-icon {
        width: 75px;
        height: 75px;
        font-size: 32px;
    }

    .profile-header h2 {
        font-size: 22px;
        margin-top: 12px;
    }

    .profile-header p {
        font-size: 14px;
    }

    .section {
        margin-top: 20px;
    }

    .section h3 {
        font-size: 18px;
        margin-bottom: 12px;
    }

    .info {
        grid-template-columns: 1fr;
        gap: 10px;
    }

    .info-box {
        padding: 13px;
    }

    .info-box label {
        font-size: 12px;
    }

    .info-box span {
        font-size: 14px;
        word-break: break-word;
    }

    .buttons {
        flex-direction: column;
        gap: 10px;
        margin-top: 25px;
    }

    button {
        width: 100%;
        padding: 12px;
    }
}


/* ============================= */
/* Small Mobile - 400px          */
/* ============================= */

@media (max-width: 400px) {

    .profile-container {
        padding: 15px;
    }

    .profile-icon {
        width: 65px;
        height: 65px;
        font-size: 28px;
    }

    .profile-header h2 {
        font-size: 20px;
    }

    .section h3 {
        font-size: 17px;
    }

    .info-box {
        padding: 11px;
    }

    .info-box span {
        font-size: 13px;
    }

    button {
        font-size: 14px;
    }
}
    </style>
</head>

<body>

<div class="profile-container">

    <div class="profile-header">
        <div class="profile-icon">👤</div>

        <h2 id="userName">Loading...</h2>
        <p>Customer Profile</p>
    </div>

    <!-- Personal Details -->
    <div class="section">

        <h3>Personal Information</h3>

        <div class="info">

            <div class="info-box">
                <label>Full Name</label>
                <span id="name">-</span>
            </div>

            <div class="info-box">
                <label>Email</label>
                <span id="email">-</span>
            </div>

            <div class="info-box">
                <label>Mobile</label>
                <span id="mobile">-</span>
            </div>

            <div class="info-box">
                <label>Customer ID</label>
                <span id="customerId">-</span>
            </div>

        </div>

    </div>


    <!-- Account Details -->
    <div class="section">

        <h3>Account Information</h3>

        <div class="info">

            <div class="info-box">
                <label>Account Number</label>
                <span id="accountNumber">-</span>
            </div>

            <div class="info-box">
                <label>Account Type</label>
                <span id="accountType">-</span>
            </div>

            <div class="info-box">
                <label>IFSC Code</label>
                <span id="ifsc">-</span>
            </div>

            <div class="info-box">
                <label>Account Status</label>
                <span id="status">-</span>
            </div>

        </div>

    </div>


    <div class="buttons">
        <button onclick="editProfile()">Edit Profile</button>
        <button onclick="changePassword()">Change Password</button>
    </div>

</div>


<script>

async function loadProfile() {

    try {

        // Login ke time save kiya hua user_id
        const userId = localStorage.getItem("user_id");

        if (!userId) {
            alert("Please login first");
            window.location.href = "login.html";
            return;
        }

        const response = await fetch(
            `http://127.0.0.1:5000/api/profile/${userId}`
        );

        const data = await response.json();

        if (data.success) {

            document.getElementById("userName").textContent = data.user.name;

            document.getElementById("name").textContent =
                data.user.name;

            document.getElementById("email").textContent =
                data.user.email;

            document.getElementById("mobile").textContent =
                data.user.mobile;

            document.getElementById("customerId").textContent =
                data.user.id;

            document.getElementById("accountNumber").textContent =
                data.account.account_number;

            document.getElementById("accountType").textContent =
                data.account.account_type;

            document.getElementById("ifsc").textContent =
                data.account.ifsc_code;

            document.getElementById("status").textContent =
                data.account.status;

        } else {

            alert(data.message);

        }

    } catch (error) {

        console.error(error);
        alert("Server error");

    }
}


function editProfile() {
    alert("Edit Profile page will open");
}

function changePassword() {
    alert("Change Password page will open");
}


loadProfile();

</script>

</body>
</html>

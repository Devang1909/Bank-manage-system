<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Transfer Money</title>

    <style>
        * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    background: #f4f7fb;
    color: #1e293b;
}

/* Navbar */

.navbar {
    height: 70px;
    background: #102c50;
    color: white;

    display: flex;
    align-items: center;
    justify-content: space-between;

    padding: 0 50px;
}

.navbar h2 {
    font-size: 25px;
}

.navbar ul {
    display: flex;
    list-style: none;
    gap: 25px;
}

.navbar ul li a {
    text-decoration: none;
    color: #d5dfec;
    padding: 10px 15px;
    border-radius: 6px;
    transition: 0.3s;
}

.navbar ul li a:hover,
.navbar ul li a.active {
    background: #2563eb;
    color: white;
}


/* Main Container */

.transfer-container {
    width: 500px;
    max-width: calc(100% - 30px);
    margin: 40px auto;
    background: white;

    padding: 30px;
    border-radius: 15px;

    box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
}

.transfer-container h1 {
    text-align: center;
    font-size: 28px;
}

.subtitle {
    text-align: center;
    color: #64748b;
    margin: 10px 0 25px;
}


/* Balance Card */

.balance-card {
    background: #102c50;
    color: white;

    padding: 20px;
    border-radius: 12px;
    margin-bottom: 25px;
}

.balance-card h3 {
    font-size: 15px;
    font-weight: normal;
    color: #d5dfec;
}

.balance-card h2 {
    margin: 10px 0;
    font-size: 30px;
}

.balance-card p {
    color: #d5dfec;
}


/* Form */

#transferForm {
    display: flex;
    flex-direction: column;
}

#transferForm label {
    margin-bottom: 7px;
    margin-top: 15px;
    font-weight: bold;
    font-size: 14px;
}

#transferForm input,
#transferForm select,
#transferForm textarea {
    width: 100%;
    padding: 12px;

    border: 1px solid #d1d5db;
    border-radius: 7px;

    outline: none;
    font-size: 14px;
}

#transferForm input:focus,
#transferForm select:focus,
#transferForm textarea:focus {
    border-color: #2563eb;
}

#transferForm textarea {
    height: 80px;
    resize: vertical;
}

#transferForm button {
    margin-top: 25px;

    padding: 13px;
    border: none;
    border-radius: 7px;

    background: #2563eb;
    color: white;

    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

#transferForm button:hover {
    background: #1d4ed8;
}

#message {
    text-align: center;
    margin-top: 20px;
    font-weight: bold;
}


/* Responsive */

@media (max-width: 600px) {

    .navbar {
        height: auto;
        padding: 20px;
        flex-direction: column;
        gap: 20px;
    }

    .navbar ul {
        flex-wrap: wrap;
        justify-content: center;
        gap: 10px;
    }

    .transfer-container {
        padding: 20px;
        margin-top: 25px;
    }

}
    </style>
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar">

        <h2>BankFlow</h2>

        <ul>
            <li><a href="dashboard.html">Dashboard</a></li>
            <li><a href="profile.html">Profile</a></li>
            <li><a href="transfer.html" class="active">Transfer</a></li>
            <li><a href="statistics.html">Statistics</a></li>
        </ul>

    </nav>


    <!-- Main Transfer Section -->
    <div class="transfer-container">

        <h1>Transfer Money</h1>

        <p class="subtitle">
            Send money to another bank account
        </p>


        <!-- Account Balance -->
        <div class="balance-card">

            <h3>Available Balance</h3>

            <h2>₹85,450.00</h2>

            <p>Savings Account</p>

        </div>


        <!-- Transfer Form -->
        <form id="transferForm">

            <label for="beneficiary">
                Beneficiary Name
            </label>

            <input
                type="text"
                id="beneficiary"
                placeholder="Enter recipient name"
                required
            >


            <label for="account">
                Account Number
            </label>

            <input
                type="text"
                id="account"
                placeholder="Enter account number"
                required
            >


            <label for="ifsc">
                IFSC Code
            </label>

            <input
                type="text"
                id="ifsc"
                placeholder="Enter IFSC code"
                required
            >


            <label for="amount">
                Amount
            </label>

            <input
                type="number"
                id="amount"
                placeholder="Enter amount"
                min="1"
                step="0.01"
                required
            >


            <label for="transferType">
                Transfer Type
            </label>

            <select id="transferType" required>

                <option value="">
                    Select Transfer Type
                </option>

                <option value="NEFT">
                    NEFT
                </option>

                <option value="IMPS">
                    IMPS
                </option>

                <option value="RTGS">
                    RTGS
                </option>

            </select>


            <label for="remark">
                Remark (Optional)
            </label>

            <textarea
                id="remark"
                placeholder="Enter transfer remark"
            ></textarea>


            <button type="submit">
                Continue Transfer
            </button>

        </form>


        <p id="message"></p>

    </div>


    <script src="transfer.js"></script>

</body>
</html>
